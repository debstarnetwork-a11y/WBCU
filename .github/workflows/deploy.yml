name: Automated Build & Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web App
        run: npm run build

      - name: 🔍 Inspect & Validate Deployment Configuration
        id: check-secrets
        run: |
          SERVER="${{ secrets.FTP_SERVER || secrets.FTP_HOST || secrets.CPANEL_SERVER || secrets.CPANEL_HOST }}"
          USERNAME="${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.CPANEL_USERNAME || secrets.CPANEL_USER }}"
          PASSWORD="${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || secrets.CPANEL_PASSWORD || secrets.CPANEL_PASS }}"
          PORT="${{ secrets.FTP_PORT || secrets.CPANEL_PORT || '21' }}"
          PROTOCOL="${{ secrets.FTP_PROTOCOL || 'ftp' }}"
          SECURITY="${{ secrets.FTP_SECURITY || 'loose' }}"
          SERVER_DIR="${{ secrets.FTP_SERVER_DIR || './' }}"

          echo "==============================================="
          echo "WB CREDIT UNION - DEPLOYMENT DIAGNOSTICS"
          echo "==============================================="

          MISSING=0
          if [ -z "$SERVER" ]; then
            echo "ℹ️ FTP_SERVER is not set in Repository Secrets."
            MISSING=1
          else
            echo "✅ FTP_SERVER is configured: [${SERVER:0:3}***]"
          fi

          if [ -z "$USERNAME" ]; then
            echo "ℹ️ FTP_USERNAME is not set in Repository Secrets."
            MISSING=1
          else
            echo "✅ FTP_USERNAME is configured: [${USERNAME:0:3}***]"
          fi

          if [ -z "$PASSWORD" ]; then
            echo "ℹ️ FTP_PASSWORD is not set in Repository Secrets."
            MISSING=1
          else
            echo "✅ FTP_PASSWORD is configured: [OK]"
          fi

          echo "ℹ️ Protocol: $PROTOCOL | Port: $PORT | Security: $SECURITY | Target Dir: $SERVER_DIR"
          echo "==============================================="

          if [ $MISSING -eq 1 ]; then
            echo "has_ftp=false" >> $GITHUB_OUTPUT
            echo "ℹ️ FTP secrets not fully provided. Will trigger cPanel Webhook deployment."
          else
            echo "has_ftp=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Deploy to cPanel via FTP / FTPS
        id: ftp-deploy
        if: ${{ steps.check-secrets.outputs.has_ftp == 'true' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || secrets.CPANEL_SERVER || secrets.CPANEL_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.CPANEL_USERNAME || secrets.CPANEL_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || secrets.CPANEL_PASSWORD || secrets.CPANEL_PASS }}
          port: ${{ secrets.FTP_PORT || secrets.CPANEL_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          security: ${{ secrets.FTP_SECURITY || 'loose' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            admin-users.json
            admin-users-persistent.json
            cpanel_wbcu_database.sql
            *.log
            *.mjs
            test-*.mjs

      - name: 🔄 Trigger cPanel Server Webhook Deploy
        if: ${{ always() && (steps.check-secrets.outputs.has_ftp != 'true' || steps.ftp-deploy.outcome != 'success') }}
        run: |
          echo "Triggering cPanel server-side deployment webhook..."
          RESPONSE=$(curl -s -m 30 -X POST https://www.wbcu.net/deploy.php || true)
          echo "Server Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Server-side git pull and deployment succeeded!"
          else
            echo "⚠️ Server Webhook Output: $RESPONSE"
            if echo "$RESPONSE" | grep -q "No space left on device"; then
              echo "::error::CRITICAL: cPanel server disk quota is 100% full. Empty Trash or clean error_log files in cPanel."
              exit 1
            fi
            if echo "$RESPONSE" | grep -i -q "success\|message\|deployed"; then
              echo "✅ Webhook sync completed."
            else
              echo "::notice::Webhook triggered. Check cPanel Git Version Control for status."
            fi
          fi
